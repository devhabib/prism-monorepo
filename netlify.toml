# Netlify Configuration File

[build]
  # 1. The command to build your app
  command = "npx nx build prism-docs --configuration=production"

  # 2. The directory where the build output lives (The path you found)
  # IMPORTANT: If your build uses Angular 17+, the index.html might actually be 
  # inside "dist/apps/prism-docs/browser". If deployment shows 404, change this line to:
  # publish = "dist/apps/prism-docs/browser"
  publish = "dist/apps/prism-docs"

# 3. Fix for Angular Routing (Prevents 404s on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 4. Cache build artifacts to make deployments faster
[[plugins]]
  package = "@netlify/plugin-nextjs" # Standard plugin often used for caching support