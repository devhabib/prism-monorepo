# Netlify Configuration File

[build]
  # Build command
  command = "npx nx build prism-docs --configuration=production"
  
  # FIX: Update publish path to include '/browser' as requested by the error
  publish = "dist/apps/prism-docs/browser"

# Fix for Angular Routing (Prevents 404s on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets for performance
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"