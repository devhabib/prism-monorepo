<div class="code-shell">
  <div class="code-header">
    <div class="header-left">
      <div class="traffic-lights">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      
      <div class="tabs">
        @if (html()) {
          <button 
            class="tab-button" 
            [class.active]="currentTab() === 'html'"
            (click)="selectedTab.set('html')">
            HTML
          </button>
        }
        @if (ts()) {
          <button 
            class="tab-button" 
            [class.active]="currentTab() === 'ts'"
            (click)="selectedTab.set('ts')">
            TypeScript
          </button>
        }
        @if (scss()) {
          <button 
            class="tab-button" 
            [class.active]="currentTab() === 'scss'"
            (click)="selectedTab.set('scss')">
            SCSS
          </button>
        }
      </div>
    </div>

    <button class="copy-btn" (click)="copyToClipboard()">
      {{ copied() ? 'Copied!' : 'Copy' }}
    </button>
  </div>
  <pre><code>{{ currentCode() }}</code></pre>
</div>
