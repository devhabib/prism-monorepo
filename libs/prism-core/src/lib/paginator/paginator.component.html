<nav class="prism-paginator" aria-label="Pagination Navigation">
  <button 
    class="paginator-btn" 
    (click)="toFirst()" 
    [disabled]="isFirst()"
    aria-label="First Page"
  >
    First
  </button>
  
  <button 
    class="paginator-btn" 
    (click)="prev()" 
    [disabled]="isFirst()"
    aria-label="Previous Page"
  >
    Prev
  </button>

  <span class="page-indicator">
    Page {{ currentPage() + 1 }} of {{ totalPages() }}
  </span>

  <button 
    class="paginator-btn" 
    (click)="next()" 
    [disabled]="isLast()"
    aria-label="Next Page"
  >
    Next
  </button>
  
  <button 
    class="paginator-btn" 
    (click)="toLast()" 
    [disabled]="isLast()"
    aria-label="Last Page"
  >
    Last
  </button>
</nav>
