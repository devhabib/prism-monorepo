<nav class="prism-paginator" aria-label="Pagination Navigation">
  <prism-button
    icon="ri-arrow-left-double-line"
    variant="outline"
    [size]="size()"
    (click)="toFirst()" 
    [disabled]="isFirst()"
    aria-label="First Page"
  />
  
  <prism-button
    icon="ri-arrow-left-s-line"
    variant="outline"
    [size]="size()"
    (click)="prev()" 
    [disabled]="isFirst()"
    aria-label="Previous Page"
  />

  <span class="page-indicator">
    Page {{ currentPage() + 1 }} of {{ totalPages() }}
  </span>

  <prism-button
    icon="ri-arrow-right-s-line"
    variant="outline"
    [size]="size()"
    (click)="next()" 
    [disabled]="isLast()"
    aria-label="Next Page"
  />
  
  <prism-button
    icon="ri-arrow-right-double-line"
    variant="outline"
    [size]="size()"
    (click)="toLast()" 
    [disabled]="isLast()"
    aria-label="Last Page"
  />
</nav>
