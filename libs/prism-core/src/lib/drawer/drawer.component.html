@if (visible()) {
  <div class="prism-drawer-mask" 
       (click)="maskClosable() ? close() : null" 
       (keydown.escape)="closeOnEscape() ? close() : null"
       tabindex="-1"
       @backdropState></div>

  <div class="prism-drawer-panel"
       role="dialog"
       aria-modal="true"
       [attr.aria-labelledby]="displayTitle ? 'prism-drawer-title' : null"
       [class]="'pos-' + position()"
       [style.width]="(position() === 'left' || position() === 'right') ? width() : '100%'"
       [style.height]="(position() === 'top' || position() === 'bottom') ? height() : '100%'"
       [@panelState]="position()">
    
    <div class="drawer-header">
      <div id="prism-drawer-title" class="title">
        @if (isTemplate(displayTitle)) { 
          <ng-container *ngTemplateOutlet="asTemplate(displayTitle)" /> 
        }
        @else { 
          {{ displayTitle }} 
        }
      </div>
      @if (showClose()) {
        <button class="button close-btn" (click)="close()" aria-label="Close drawer">
          <i class="ri-close-line"></i>
        </button>
      }
    </div>

    <div class="drawer-body">
      <ng-content />
    </div>

    @if (footer()) {
      <div class="drawer-footer">
        @if (isTemplate(footer())) { 
          <ng-container *ngTemplateOutlet="asTemplate(footer())" /> 
        }
        @else { 
          {{ footer() }} 
        }
      </div>
    }
  </div>
}
