<div class="api-table-container">
  <table class="api-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Default</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      @for (item of data(); track item.name) {
        <tr>
          <td><code class="prop-name">{{ item.name }}</code></td>
          <td><code class="prop-type">{{ item.type }}</code></td>
          <td><code class="prop-default">{{ item.default }}</code></td>
          <td>{{ item.description }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
