<button type="button" 
        role="switch" 
        [attr.aria-checked]="checked()" 
        [disabled]="disabled()"
        class="prism-switch"
        [class.checked]="checked()">
  
  <div class="prism-switch-handle">
    @if (loading()) { <i class="ri-loader-4-line animate-spin"></i> }
  </div>

  <div class="prism-switch-inner">
    @if (checked()) {
      @if (isTemplate(checkedChildren())) { <ng-container *ngTemplateOutlet="$any(checkedChildren())" /> }
      @else { {{ checkedChildren() }} }
    } @else {
      @if (isTemplate(unCheckedChildren())) { <ng-container *ngTemplateOutlet="$any(unCheckedChildren())" /> }
      @else { {{ unCheckedChildren() }} }
    }
  </div>
</button>
