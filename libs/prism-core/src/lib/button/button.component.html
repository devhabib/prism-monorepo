<button 
  [disabled]="isButtonDisabled()"
  [class]="buttonClasses()"
>
  @if (loading()) {
    <prism-icon name="loader-4-line" class="p-button-loading-icon" />
  } @else if (icon() && iconPos() === 'left') {
    <prism-icon [name]="icon()!" class="p-button-icon-left" />
  }

  @if (label()) {
    <span class="p-button-label">{{ label() }}</span>
  } @else {
    <ng-content />
  }

  @if (!loading() && icon() && iconPos() === 'right') {
    <prism-icon [name]="icon()!" class="p-button-icon-right" />
  }
</button>
