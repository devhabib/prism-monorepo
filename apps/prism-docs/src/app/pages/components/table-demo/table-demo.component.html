<!-- Row Templates (Must be defined for ViewChild to find them) -->
<ng-template #amountCell let-row="row">
  <span [class]="row.amount < 0 ? 'text-red-500 font-medium' : 'text-green-600 font-medium'">
    {{ row.amount | currency }}
  </span>
</ng-template>

<ng-template #statusCell let-row="row">
  <prism-badge [count]="row.status" [status]="getStatusVariant(row.status)" [isStandalone]="true" />
</ng-template>

<ng-template #nameCell let-row="row">
  <div class="flex items-center gap-3">
    <prism-avatar [image]="row.avatar" [label]="row.name.charAt(0)" shape="circle" size="md"></prism-avatar>
    <div>
      <span class="font-medium block">{{ row.name }}</span>
    </div>
  </div>
</ng-template>

<ng-template #imageCell let-row="row">
  <img [src]="row.image" class="w-10 h-10 rounded object-cover border border-slate-200 dark:border-slate-700" alt="Product" />
</ng-template>

<ng-template #actionsCell let-row="row">
  <prism-button 
    label="View" 
    size="sm" 
    variant="outline"
    icon="eye-line"
    (click)="viewDetails(row)" />
</ng-template>

<prism-demo-page-header 
  title="Data Table" 
  subtitle="Displays data in rows and columns with sorting, pagination, and custom templates." 
/>

<prism-tab-group>
  <prism-tab label="Examples">
    
    <prism-demo-section title="Financial Ledger" subtitle="Gridlines and conditional styling for financial data.">
      <prism-demo-card>
        <div preview class="w-full overflow-x-auto">
          <prism-table [data]="financeData" [columns]="financeCols" size="sm" [gridlines]="true" [striped]="true" [width]="'100%'" />
        </div>
        <prism-code-block [html]="snippets.financeHTML" [ts]="snippets.financeTS" />
      </prism-demo-card>
    </prism-demo-section>

    <prism-demo-section title="Team Roster" subtitle="Rich content with avatars and action buttons.">
      <prism-demo-card>
        <div preview class="w-full overflow-x-auto">
          <prism-table [data]="teamData" [columns]="teamCols" size="lg" [width]="'100%'" />
        </div>
        <prism-code-block [html]="snippets.teamHTML" [ts]="snippets.teamTS" />
      </prism-demo-card>
    </prism-demo-section>

    <prism-demo-section title="Inventory" subtitle="Sorting, pagination, and image previews.">
      <prism-demo-card>
        <div preview class="w-full overflow-x-auto">
          <prism-table [data]="inventoryData" [columns]="inventoryCols" [paginator]="true" [rows]="3" [width]="'100%'" />
        </div>
        <prism-code-block [html]="snippets.inventoryHTML" [ts]="snippets.inventoryTS" />
      </prism-demo-card>
    </prism-demo-section>

    <prism-demo-section title="Single Selection" subtitle="Select a single row from the table.">
      <prism-demo-card>
        <div preview class="w-full overflow-x-auto">
          <div class="flex items-center gap-2 mb-4 min-h-[32px] p-2 bg-slate-50 rounded border border-slate-200">
            <span class="text-sm text-muted">Selected:</span>
            @if (singleSelection()) {
              <prism-tag [label]="singleSelection()!.name" (onRemove)="singleSelection.set(null)" [removable]="true" />
            } @else {
              <span class="text-xs italic text-muted">None</span>
            }
          </div>
          
          <prism-table 
            [data]="userSelectionData" 
            [columns]="userCols"
            selectionMode="single"
            dataKey="id"
            [(selection)]="singleSelection"
            [width]="'100%'" />
        </div>
        <!-- Snippet for selection could be added here -->
      </prism-demo-card>
    </prism-demo-section>

    <prism-demo-section title="Multiple Selection" subtitle="Select multiple rows using checkboxes.">
      <prism-demo-card>
        <div preview class="w-full overflow-x-auto">
          <div class="flex items-center gap-2 mb-4 min-h-[32px] p-2 bg-slate-50 rounded border border-slate-200">
            <span class="text-sm text-muted">Selection Count:</span>
            <prism-badge [count]="multipleSelection().length.toString()" status="default" [isStandalone]="true" />
          </div>
          
          <prism-table 
            [data]="userSelectionData" 
            [columns]="userCols"
            selectionMode="multiple"
            dataKey="id"
            [(selection)]="multipleSelection"
            [width]="'100%'" />
        </div>
         <!-- Snippet for selection could be added here -->
      </prism-demo-card>
    </prism-demo-section>

    <prism-demo-section title="Empty State" subtitle="Automatic empty state when no data is provided.">
      <prism-demo-card>
        <div preview class="w-full overflow-x-auto">
          <div class="flex justify-end gap-2 mb-4">
            <prism-button label="Clear Data" variant="outline" size="sm" icon="delete-bin-line" (click)="clearData()" />
            <prism-button label="Reset Data" variant="text" size="sm" (click)="resetData()" />
          </div>
          
          <prism-table 
            [data]="emptyTableData()" 
            [columns]="userCols" 
            [width]="'100%'" />
        </div>
      </prism-demo-card>
    </prism-demo-section>

  </prism-tab>

  <prism-tab label="API">
    <prism-demo-section title="Component API">
        <prism-api-table [data]="apiData" />
    </prism-demo-section>
  </prism-tab>
</prism-tab-group>

<!-- Details Dialog -->
<prism-dialog 
  [(visible)]="showDetailsDialog" 
  header="Employee Profile"
  width="480px">
  @if (selectedRow()) {
    <div class="flex flex-col items-center text-center mb-6 mt-1">
      <prism-avatar 
        [image]="selectedRow()!.avatar" 
        [label]="selectedRow()!.name.charAt(0)" 
        shape="circle" 
        size="xl"
        class="mb-3 shadow-md border-2 border-white" />
      <h3 class="text-lg font-bold mb-0.5" style="color: var(--prism-text-primary);">{{ selectedRow()!.name }}</h3>
      <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-blue-50 text-blue-600 border border-blue-100 uppercase tracking-wider">
        {{ selectedRow()!.role }}
      </span>
    </div>

    <div class="divide-y divide-slate-100 border-t border-b border-slate-100 -mx-6">
      <div class="flex justify-between items-center py-3 px-6">
        <span class="text-xs font-medium uppercase tracking-tight text-slate-400">Employee ID</span>
        <span class="text-sm font-semibold" style="color: var(--prism-text-primary);">#{{ selectedRow()!.id }}</span>
      </div>
      <div class="flex justify-between items-center py-3 px-6">
        <span class="text-xs font-medium uppercase tracking-tight text-slate-400">Current Status</span>
        <prism-badge [count]="selectedRow()!.status" [status]="getStatusVariant(selectedRow()!.status)" [isStandalone]="true" />
      </div>
      <div class="flex flex-col gap-2 py-3 px-6">
        <span class="text-xs font-medium uppercase tracking-tight text-slate-400">Profile Metadata</span>
        <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded border border-slate-200">
           <i class="ri-link text-slate-400"></i>
           <span class="text-xs text-slate-500 font-mono truncate select-all">{{ selectedRow()!.avatar || 'N/A' }}</span>
        </div>
      </div>
    </div>
  }
  <div footer>
    <prism-button label="Close" variant="outline" (click)="showDetailsDialog.set(false)" class="w-full" />
  </div>
</prism-dialog>
