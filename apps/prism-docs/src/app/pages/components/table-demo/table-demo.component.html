<div class="demo-container">
  <h1>Data Table Engine</h1>
  <p>Headless, Signal-based, Type-safe.</p>

  <prism-table [data]="projects()" [columns]="tableCols">
    <!-- Status Column Template -->
    <ng-template #statusCell let-val let-row="row">
      <span class="badge" [class]="row.status.toLowerCase()">
        {{ row.status }}
      </span>
    </ng-template>

    <!-- Revenue Column Template -->
    <ng-template #revenueCell let-val>
      {{ val | currency:'USD':'symbol':'1.0-0' }}
    </ng-template>
  </prism-table>
</div>
