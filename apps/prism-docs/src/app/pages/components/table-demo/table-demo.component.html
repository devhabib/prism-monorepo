<h1>Prism Data Table</h1>

<prism-table [data]="mockData" [columns]="cols">
  <ng-template #statusCell let-row="row">
    <span class="badge" [class]="row.status.toLowerCase()">
      {{ row.status }}
    </span>
  </ng-template>
</prism-table>

<div class="paginator-container">
  <prism-paginator 
    [totalRecords]="50" 
    [rows]="5" 
    (onPageChange)="onPageChange($event)">
  </prism-paginator>
</div>
