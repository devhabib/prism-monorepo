<prism-demo-page-header title="Alert" subtitle="A component for displaying important messages to users.">
</prism-demo-page-header>

<prism-demo-section title="Basic Usage">
  <prism-demo-card>
    <prism-tab-group variant="pill">
      <prism-tab label="Preview">
        <div class="p-4 space-y-4">
          <prism-alert type="info" title="Informational" description="This is a standard informational message."></prism-alert>
          <prism-alert type="success" title="Success" description="Your changes have been saved successfully." [showIcon]="true"></prism-alert>
          <prism-alert type="warning" title="Warning" description="This action is irreversible. Proceed with caution." [showIcon]="true"></prism-alert>
          <prism-alert type="error" title="Error" description="Failed to fetch data from the server." [showIcon]="true"></prism-alert>
        </div>
      </prism-tab>
      <prism-tab label="Code">
        <prism-code-block [ts]="snippets.usage"></prism-code-block>
      </prism-tab>
    </prism-tab-group>
  </prism-demo-card>
</prism-demo-section>

<prism-demo-section title="Closeable">
  <prism-demo-card>
    <prism-tab-group variant="pill">
      <prism-tab label="Preview">
        <div class="p-4">
          <prism-alert 
            type="info" 
            title="Notification" 
            description="This alert can be closed by clicking the X button." 
            [closeable]="true" 
            [showIcon]="true">
          </prism-alert>
        </div>
      </prism-tab>
      <prism-tab label="Code">
        <prism-code-block [ts]="snippets.closeable"></prism-code-block>
      </prism-tab>
    </prism-tab-group>
  </prism-demo-card>
</prism-demo-section>
