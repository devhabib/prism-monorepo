<prism-demo-page-header title="Badge" subtitle="A small numerical value or status descriptor for another element.">
</prism-demo-page-header>

<prism-demo-section title="Basic Usage">
  <prism-demo-card>
    <prism-tab-group variant="pill">
      <prism-tab label="Preview">
        <div class="p-4 flex gap-4">
          <prism-badge label="99"></prism-badge>
          <prism-badge label="New" variant="success"></prism-badge>
        </div>
      </prism-tab>
      <prism-tab label="Code">
        <prism-code-block [ts]="snippets.usage"></prism-code-block>
      </prism-tab>
    </prism-tab-group>
  </prism-demo-card>
</prism-demo-section>
