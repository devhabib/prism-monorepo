<prism-demo-page-header title="Tag" subtitle="A component for categorizing or labeling content with keywords.">
</prism-demo-page-header>

<prism-demo-section title="Basic Usage">
  <prism-demo-card>
    <prism-tab-group variant="pill">
      <prism-tab label="Preview">
        <div class="p-4 flex gap-2">
          <prism-tag label="Default Tag"></prism-tag>
          <prism-tag label="Outline Tag" variant="outline"></prism-tag>
        </div>
      </prism-tab>
      <prism-tab label="Code">
        <prism-code-block [ts]="snippets.usage"></prism-code-block>
      </prism-tab>
    </prism-tab-group>
  </prism-demo-card>
</prism-demo-section>
