<prism-demo-page-header 
  title="Drawer" 
  subtitle="Flexible side panels for mobile menus, details views, and navigation." 
/>

<prism-tab-group>
  <prism-tab label="Examples">
    
    <prism-demo-section title="Positioning" description="Drawers can slide in from any of the four edges.">
      <prism-demo-card>
        <div preview class="flex gap-4 flex-wrap">
          <prism-button label="Right (Default)" (click)="open('right')" />
          <prism-button label="Left" variant="secondary" (click)="open('left')" />
          <prism-button label="Top" variant="outline" (click)="open('top')" />
          <prism-button label="Bottom" variant="outline" (click)="open('bottom')" />
        </div>
        <prism-code-block [html]="basicUsageHTML" [ts]="basicUsageTS" />
      </prism-demo-card>
    </prism-demo-section>

    <prism-demo-section title="Customization" description="Control dimensions and handle custom content via templates.">
      <prism-demo-card>
        <div preview class="flex gap-4 flex-wrap">
          <prism-button label="Custom Width (50%)" variant="secondary" (click)="openCustom()" />
          <prism-button label="Open via Service" icon="ri-service-line" (click)="openService()" />
        </div>
        <prism-code-block [ts]="serviceUsageTS" />
      </prism-demo-card>
    </prism-demo-section>

    <!-- Drawer Template (Required for the demo to work) -->
    <prism-drawer 
      [(visible)]="isVisible" 
      [position]="placement()" 
      [title]="'Basic Drawer'"
      [width]="width()"
      [footer]="showFooter() ? footerTpl : null">
      <div class="space-y-4">
        <p>This is dynamic drawer content. You can place any component or HTML here.</p>
        
        <prism-card header="Drawer Details" subheader="Contextual Info">
          <p class="text-sm text-muted">Drawers are perfect for:</p>
          <ul class="text-sm list-disc pl-4 mt-2 space-y-1">
            <li>Mobile navigation menus</li>
            <li>Details view for table rows</li>
            <li>Contextual filtering options</li>
            <li>Quick actions sidebar</li>
          </ul>
        </prism-card>
      </div>
    </prism-drawer>

    <ng-template #footerTpl>
      <div class="flex justify-end gap-2">
        <prism-button label="Cancel" variant="text" (click)="close()" />
        <prism-button label="Confirm Action" (click)="close()" />
      </div>
    </ng-template>

  </prism-tab>

  <prism-tab label="API">
    
    <prism-demo-section title="PrismDrawerComponent API" description="Inputs and outputs for the template-directive usage.">
      <prism-api-table [data]="apiDocs" />
    </prism-demo-section>

    <prism-demo-section title="PrismDrawerService API" description="Options for opening drawers programmatically.">
      <prism-api-table [data]="serviceApiDocs" />
    </prism-demo-section>

    <prism-demo-section title="PrismDrawerRef & Tokens" description="Handling lifecycle and data injection within dynamic components.">
      <div class="space-y-8">
        <div>
          <h4 class="text-sm font-semibold mb-2">PrismDrawerRef</h4>
          <prism-api-table [data]="refApiDocs" />
          <div class="mt-4">
            <prism-code-block [ts]="refUsageTS" />
          </div>
        </div>
        <div>
          <h4 class="text-sm font-semibold mb-2">DRAWER_DATA</h4>
          <prism-api-table [data]="tokenApiDocs" />
          <div class="mt-4">
            <prism-code-block [ts]="tokenUsageTS" />
          </div>
        </div>
      </div>
    </prism-demo-section>

  </prism-tab>
</prism-tab-group>
