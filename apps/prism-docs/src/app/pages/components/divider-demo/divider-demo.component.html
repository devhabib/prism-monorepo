<prism-demo-page-header title="Divider" subtitle="A horizontal or vertical line for partitioning content." />

<prism-tab-group>
  <prism-tab label="Examples">
    <div class="space-y-8">
      <prism-demo-section title="Basic Usage" description="Dividers are used to separate content blocks.">
        <prism-demo-card>
          <div preview>
            <div class="p-8 flex flex-col gap-4 bg-surface-50">
              <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
              <prism-divider></prism-divider>
              <p>Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
            </div>
          </div>
          <prism-code-block code [code]="snippets.basic" language="html"></prism-code-block>
        </prism-demo-card>
      </prism-demo-section>

      <prism-demo-section title="With Text" description="Dividers can contain text, positioned left, right, or center.">
        <prism-demo-card>
          <div preview>
            <div class="p-8 flex flex-col gap-4 bg-surface-50">
              <prism-divider text="Text"></prism-divider>
              <prism-divider orientation="left" text="Left Text"></prism-divider>
              <prism-divider orientation="right" text="Right Text"></prism-divider>
            </div>
          </div>
          <prism-code-block code [code]="snippets.text" language="html"></prism-code-block>
        </prism-demo-card>
      </prism-demo-section>

      <prism-demo-section title="With Template" description="Dividers can use TemplateRef for complex content like icons.">
        <prism-demo-card>
          <div preview>
            <div class="p-8 flex flex-col gap-4 bg-surface-50">
              <ng-template #iconContent>
                  <prism-icon name="star-fill" class="text-primary-800"></prism-icon>
              </ng-template>
              <prism-divider [text]="iconContent"></prism-divider>
              
              <ng-template #customContent>
                  <div class="flex items-center gap-2 text-primary-600 font-medium">
                      <prism-icon name="flashlight-fill"></prism-icon>
                      <span>Power Up</span>
                  </div>
              </ng-template>
              <prism-divider [text]="customContent" [dashed]="true"></prism-divider>
            </div>
          </div>
          <prism-code-block code [code]="snippets.template" language="html"></prism-code-block>
        </prism-demo-card>
      </prism-demo-section>

      <prism-demo-section title="Vertical" description="A vertical divider can be used between inline elements.">
        <prism-demo-card>
          <div preview>
            <div class="p-8 flex items-center bg-surface-50">
              <span>Link 1</span>
              <prism-divider type="vertical"></prism-divider>
              <span>Link 2</span>
              <prism-divider type="vertical"></prism-divider>
              <span>Link 3</span>
            </div>
          </div>
          <prism-code-block code [code]="snippets.vertical" language="html"></prism-code-block>
        </prism-demo-card>
      </prism-demo-section>
    </div>
  </prism-tab>

  <prism-tab label="API">
    <prism-demo-section title="API Data">
      <prism-api-table [data]="apiData"></prism-api-table>
    </prism-demo-section>
  </prism-tab>
</prism-tab-group>
