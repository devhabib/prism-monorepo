<prism-demo-page-header title="Divider" subtitle="A horizontal or vertical line for partitioning content." />

<prism-tab-group>
  <prism-tab label="Examples">
    <div class="space-y-8">
      <prism-demo-section title="Basic Usage" description="Dividers are used to separate content blocks.">
        <div class="border border-surface-200 rounded-xl overflow-hidden bg-surface-0">
          <prism-tab-group variant="pill">
            <prism-tab label="Preview">
              <div class="p-8 flex flex-col gap-4 bg-surface-50">
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
                <prism-divider></prism-divider>
                <p>Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
              </div>
            </prism-tab>
            <prism-tab label="Code">
              <prism-code-block language="html" [code]="snippets.basic"></prism-code-block>
            </prism-tab>
          </prism-tab-group>
        </div>
      </prism-demo-section>

      <prism-demo-section title="With Text" description="Dividers can contain text, positioned left, right, or center.">
        <div class="border border-surface-200 rounded-xl overflow-hidden bg-surface-0">
          <prism-tab-group variant="pill">
            <prism-tab label="Preview">
              <div class="p-8 flex flex-col gap-4 bg-surface-50">
                <prism-divider>Text</prism-divider>
                <prism-divider orientation="left">Left Text</prism-divider>
                <prism-divider orientation="right">Right Text</prism-divider>
              </div>
            </prism-tab>
            <prism-tab label="Code">
              <prism-code-block language="html" [code]="snippets.text"></prism-code-block>
            </prism-tab>
          </prism-tab-group>
        </div>
      </prism-demo-section>

      <prism-demo-section title="Vertical" description="A vertical divider can be used between inline elements.">
        <div class="border border-surface-200 rounded-xl overflow-hidden bg-surface-0">
          <prism-tab-group variant="pill">
            <prism-tab label="Preview">
              <div class="p-8 flex items-center bg-surface-50">
                <span>Link 1</span>
                <prism-divider type="vertical"></prism-divider>
                <span>Link 2</span>
                <prism-divider type="vertical"></prism-divider>
                <span>Link 3</span>
              </div>
            </prism-tab>
            <prism-tab label="Code">
              <prism-code-block language="html" [code]="snippets.vertical"></prism-code-block>
            </prism-tab>
          </prism-tab-group>
        </div>
      </prism-demo-section>
    </div>
  </prism-tab>

  <prism-tab label="API">
    <prism-demo-section title="API Data">
      <prism-api-table [data]="apiData"></prism-api-table>
    </prism-demo-section>
  </prism-tab>
</prism-tab-group>
