<prism-demo-page-header title="Date Picker" subtitle="A component for selecting dates.">
</prism-demo-page-header>

<prism-tab-group variant="line" class="mt-8">
  <prism-tab label="Examples">
    <div class="demo-content">
      <prism-demo-section title="Basic Usage" description="Basic date selection with internal calendar.">
  <prism-demo-card [minHeight]="'300px'">
    <prism-tab-group variant="pill">
      <prism-tab label="Preview">
        <div class="p-4 space-y-4 max-w-sm" style="min-height: 380px;">
          <prism-date-picker [(value)]="selectedDate" placeholder="Pick a date" />
          <div class="text-sm text-muted">Selected Date: {{ selectedDate() | date:'mediumDate' }}</div>
        </div>
      </prism-tab>
      <prism-tab label="Code">
        <prism-code-block [ts]="snippets.usage"></prism-code-block>
      </prism-tab>
    </prism-tab-group>
  </prism-demo-card>
</prism-demo-section>

<prism-demo-section title="Disabled State" description="Read-only or disabled date selection.">
  <prism-demo-card >
    <prism-tab-group variant="pill">
      <prism-tab label="Preview">
        <div class="p-4 space-y-4 max-w-sm">
          <prism-date-picker [disabled]="true" [value]="selectedDate()" />
        </div>
      </prism-tab>
      <prism-tab label="Code">
        <prism-code-block [ts]="snippets.disabled"></prism-code-block>
      </prism-tab>
    </prism-tab-group>
  </prism-demo-card>
</prism-demo-section>

<prism-demo-section title="Custom Placeholder" description="Set a custom placeholder for the input.">
  <prism-demo-card [minHeight]="'300px'">
    <prism-tab-group variant="pill">
      <prism-tab label="Preview">
        <div class="p-4 space-y-4 max-w-sm" style="min-height: 380px;">
          <prism-date-picker placeholder="Choose your birthday" />
        </div>
      </prism-tab>
      <prism-tab label="Code">
        <prism-code-block [ts]="snippets.placeholder"></prism-code-block>
      </prism-tab>
    </prism-tab-group>
  </prism-demo-card>
</prism-demo-section>
    </div>
  </prism-tab>

  <prism-tab label="API">
    <div class="api-content mt-8">
      <prism-demo-section title="PrismDatePicker API">
        <prism-api-table [data]="apiData"></prism-api-table>
      </prism-demo-section>
    </div>
  </prism-tab>
</prism-tab-group>
