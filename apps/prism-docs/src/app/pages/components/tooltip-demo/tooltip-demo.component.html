<prism-demo-page-header 
  title="Tooltip" 
  subtitle="A simple text popup tip." 
/>

<prism-tab-group>
  <prism-tab label="Examples">
    
    <prism-demo-section title="Basic Usage" subtitle="The most basic tooltip implementation.">
      <prism-demo-card>
        <div preview>
          <prism-button prismTooltip="Prompt Text" label="Hover me" />
        </div>
        <prism-code-block [code]="basicHTML" language="html" />
      </prism-demo-card>
    </prism-demo-section>

    <prism-demo-section title="Placement" subtitle="Tooltips can be positioned in four primary directions.">
      <prism-demo-card>
        <div preview class="flex flex-wrap gap-4 items-center">
          <prism-button variant="outline" prismTooltip="Top Tooltip" tooltipPosition="top" label="Top" />
          <prism-button variant="outline" prismTooltip="Bottom Tooltip" tooltipPosition="bottom" label="Bottom" />
          <prism-button variant="outline" prismTooltip="Left Tooltip" tooltipPosition="left" label="Left" />
          <prism-button variant="outline" prismTooltip="Right Tooltip" tooltipPosition="right" label="Right" />
        </div>
        <prism-code-block [code]="positionHTML" language="html" />
      </prism-demo-card>
    </prism-demo-section>

    <prism-demo-section title="Custom Content (Template)" subtitle="Complex content including icons and bold text can be passed via <code>ng-template</code>.">
      <prism-demo-card>
        <div preview>
          <prism-button variant="secondary" [prismTooltip]="customTpl" label="Template Content" />
          
          <ng-template #customTpl>
            <div class="flex items-center gap-2">
              <i class="ri-user-smile-line"></i>
              <span>You can use <b>HTML</b> and <b>Icons</b></span>
            </div>
          </ng-template>
        </div>
        <prism-code-block [code]="templateHTML" language="html" />
      </prism-demo-card>
    </prism-demo-section>

    <prism-demo-section title="Triggers" subtitle="Tooltips can be triggered by <code>hover</code>, <code>click</code>, or <code>focus</code>.">
      <prism-demo-card>
        <div preview class="flex gap-4">
          <prism-button prismTooltip="Click me!" tooltipTrigger="click" label="Click Trigger" />
          <prism-button prismTooltip="Focus me!" tooltipTrigger="focus" label="Focus Trigger" />
        </div>
        <prism-code-block [code]="triggerHTML" language="html" />
      </prism-demo-card>
    </prism-demo-section>

  </prism-tab>

  <prism-tab label="API">
    <prism-api-table [data]="apiDocs" />
  </prism-tab>
</prism-tab-group>
