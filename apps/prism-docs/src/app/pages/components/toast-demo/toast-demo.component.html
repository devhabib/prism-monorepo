<prism-demo-page-header 
  title="Toast" 
  subtitle="Contextual feedback messages for user actions." 
/>

<prism-tab-group>
  <prism-tab label="Examples">
    
    <prism-demo-section title="Notifications" description="Trigger different severity levels to notify users.">
      <prism-demo-card>
        <div preview class="flex gap-4 flex-wrap">
          <prism-button label="Success Toast" variant="primary" (click)="showSuccess()" />
          <prism-button label="Warning Toast" variant="secondary" (click)="showWarning()" />
          <prism-button label="Danger Toast" variant="danger" (click)="showDanger()" />
          <prism-button label="Info Toast" variant="outline" (click)="showInfo()" />
        </div>
        <prism-code-block [ts]="snippets.usageTS" [html]="snippets.usageHTML" />
      </prism-demo-card>
    </prism-demo-section>

  </prism-tab>

  <prism-tab label="API">
    <prism-demo-section title="ToastService API">
      <prism-api-table [data]="apiData" />
    </prism-demo-section>
  </prism-tab>
</prism-tab-group>
