<prism-demo-page-header title="Breadcrumb" subtitle="A hierarchy navigation component that displays the path of the current page.">
</prism-demo-page-header>

<prism-demo-section title="Basic Usage">
  <prism-demo-card>
    <prism-tab-group variant="pill">
      <prism-tab label="Preview">
        <div class="p-4">
          <prism-breadcrumb>
            <prism-breadcrumb-item>Home</prism-breadcrumb-item>
            <prism-breadcrumb-item>Components</prism-breadcrumb-item>
            <prism-breadcrumb-item>Navigation</prism-breadcrumb-item>
            <prism-breadcrumb-item>Breadcrumb</prism-breadcrumb-item>
          </prism-breadcrumb>
        </div>
      </prism-tab>
      <prism-tab label="Code">
        <prism-code-block [ts]="snippets.usage"></prism-code-block>
      </prism-tab>
    </prism-tab-group>
  </prism-demo-card>
</prism-demo-section>

<prism-demo-section title="Custom Separator">
  <prism-demo-card>
    <prism-tab-group variant="pill">
      <prism-tab label="Preview">
        <div class="p-4">
          <prism-breadcrumb separator=">">
            <prism-breadcrumb-item>Home</prism-breadcrumb-item>
            <prism-breadcrumb-item>Navigation</prism-breadcrumb-item>
            <prism-breadcrumb-item>Breadcrumb</prism-breadcrumb-item>
          </prism-breadcrumb>
        </div>
      </prism-tab>
      <prism-tab label="Code">
        <prism-code-block [ts]="snippets.separator"></prism-code-block>
      </prism-tab>
    </prism-tab-group>
  </prism-demo-card>
</prism-demo-section>
