<prism-demo-page-header title="Cascader" description="A selection component used for multi-level hierarchical structures.">
</prism-demo-page-header>

<prism-tab-group variant="line" class="mt-8">
  <prism-tab label="Examples">
    <div class="demo-content">
      <prism-demo-section title="Basic Usage" description="The simplest usage of Cascader.">
        <prism-demo-card [minHeight]="'300px'">
          <div preview class="demo-preview">
            <div class="w-full max-w-sm">
              <prism-cascader [(value)]="basicValue" [options]="options" />
              <p class="mt-4 text-sm text-muted">Value: {{ basicValue().join(' / ') || 'None' }}</p>
            </div>
          </div>
          <prism-code-block code [code]="snippets.basic" language="html"></prism-code-block>
        </prism-demo-card>
      </prism-demo-section>

      <prism-demo-section title="Default Value" description="Setting a pre-selected value.">
        <prism-demo-card [minHeight]="'300px'">
          <div preview class="demo-preview">
            <div class="w-full max-w-sm">
              <prism-cascader [(value)]="defaultValue" [options]="options" />
            </div>
          </div>
          <prism-code-block code [code]="snippets.default" language="html"></prism-code-block>
        </prism-demo-card>
      </prism-demo-section>

      <prism-demo-section title="Hover Trigger" description="Expand sub-menus when mouse hovers over an option.">
        <prism-demo-card [minHeight]="'300px'">
          <div preview class="demo-preview">
            <div class="w-full max-w-sm">
              <prism-cascader [(value)]="hoverValue" [options]="options" expandTrigger="hover" />
            </div>
          </div>
          <prism-code-block code [code]="snippets.hover" language="html"></prism-code-block>
        </prism-demo-card>
      </prism-demo-section>

      <prism-demo-section title="Disabled" description="Disabled state of the component. 'Jiangsu' node is also disabled in data.">
        <prism-demo-card [minHeight]="'300px'">
          <div preview class="demo-preview">
            <div class="w-full max-w-sm">
              <prism-cascader [options]="options" [disabled]="true" />
            </div>
          </div>
          <prism-code-block code [code]="snippets.disabled" language="html"></prism-code-block>
        </prism-demo-card>
      </prism-demo-section>
    </div>
  </prism-tab>

  <prism-tab label="API">
    <div class="api-content mt-8">
      <prism-demo-section title="PrismCascader API">
        <prism-api-table [data]="apiData"></prism-api-table>
      </prism-demo-section>
    </div>
  </prism-tab>
</prism-tab-group>
