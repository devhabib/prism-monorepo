<prism-demo-page-header title="Select" subtitle="A selection component for selecting a value from a dropdown list.">
</prism-demo-page-header>

<prism-demo-section title="Basic Usage">
  <prism-demo-card [minHeight]="'300px'">
    <div preview class="demo-preview">
      <div style="width: 300px;">
        <prism-select label="Choose an option"></prism-select>
      </div>
    </div>
    <prism-code-block code [code]="snippets.usage" language="html"></prism-code-block>
  </prism-demo-card>
</prism-demo-section>
