<prism-demo-page-header title="Select" subtitle="A selection component for selecting a value from a dropdown list.">
</prism-demo-page-header>

<prism-demo-section title="Basic Usage">
  <prism-demo-card>
    <prism-tab-group variant="pill">
      <prism-tab label="Preview">
        <div class="p-4">
          <prism-select label="Choose an option"></prism-select>
        </div>
      </prism-tab>
      <prism-tab label="Code">
        <prism-code-block [ts]="snippets.usage"></prism-code-block>
      </prism-tab>
    </prism-tab-group>
  </prism-demo-card>
</prism-demo-section>
