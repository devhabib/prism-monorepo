<prism-demo-page-header 
  title="Tree" 
  subtitle="A hierarchical components for representing directory structures, navigation menus, and nested data.">
</prism-demo-page-header>

<prism-tab-group>
  <prism-tab label="Examples">
    <prism-demo-section title="Basic Tree">
      <prism-demo-card>
        <div preview>
          <div class="p-4 rounded-lg">
            <prism-tree [data]="treeData" />
          </div>
        </div>
        <div code>
          <prism-code-block [ts]="snippets.basic"></prism-code-block>
        </div>
      </prism-demo-card>
    </prism-demo-section>

    <prism-demo-section title="Directory Mode">
      <prism-demo-card>
        <div preview>
          <div class="p-4 rounded-lg">
            <prism-tree 
              [data]="directoryData" 
              [directoryMode]="true" 
              [expandedKeys]="['root']" 
            />
          </div>
        </div>
        <div code>
          <prism-code-block [ts]="snippets.directory"></prism-code-block>
        </div>
      </prism-demo-card>
    </prism-demo-section>

    <prism-demo-section title="Checkable">
      <prism-demo-card>
        <div preview>
          <div class="p-4 rounded-lg">
            <prism-tree 
              [data]="treeData" 
              [checkable]="true" 
              [(checkedKeys)]="checkedKeys" 
            />
            <div class="mt-4 text-sm text-zinc-500">
              Checked: {{ checkedKeys() | json }}
            </div>
          </div>
        </div>
        <div code>
          <prism-code-block [ts]="snippets.checkable"></prism-code-block>
        </div>
      </prism-demo-card>
    </prism-demo-section>
  </prism-tab>

  <prism-tab label="API">
    <prism-demo-section title="Tree API">
        <prism-api-table [data]="apiData.inputs" />
    </prism-demo-section>
  </prism-tab>
</prism-tab-group>
