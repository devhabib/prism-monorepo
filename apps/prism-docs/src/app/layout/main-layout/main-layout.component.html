<div class="layout-wrapper flex flex-col md:flex-row h-screen w-screen overflow-hidden bg-[var(--bg-app)]">

  <!-- Mobile Header -->
  <header class="mobile-header md:hidden flex items-center justify-between p-4 border-b border-[var(--border)] bg-[var(--surface-0)] z-40 shrink-0">
    <div class="flex items-center gap-3">
      <button (click)="toggleSidebar()" class="p-2 -ml-2 rounded-md hover:bg-[var(--surface-1)] text-[var(--text-main)] transition-colors">
        <prism-icon name="menu-line"></prism-icon>
      </button>
      <span class="font-semibold text-lg text-[var(--text-main)]">Prism Docs</span>
    </div>
  </header>

  <!-- Mobile Backdrop -->
  @if (isSidebarOpen()) {
    <div class="fixed inset-0 z-40 bg-black/50 md:hidden backdrop-blur-sm transition-opacity" 
         (click)="closeSidebar()" 
         (keyup.enter)="closeSidebar()"
         tabindex="0"
         role="button"
         aria-label="Close sidebar"></div>
  }

  <!-- Sidebar -->
  <aside class="layout-sidebar
                fixed inset-y-0 left-0 z-50 w-64 bg-[var(--surface-0)] border-r border-[var(--border)]
                transform transition-transform duration-300 ease-in-out
                md:translate-x-0 md:transform-none md:static md:block md:w-64 md:h-full md:shrink-0"
         [class.-translate-x-full]="!isSidebarOpen()"
         [class.translate-x-0]="isSidebarOpen()">
    <app-sidebar></app-sidebar>
  </aside>

  <!-- Main Content -->
  <main class="layout-content flex-1 h-full overflow-y-auto p-4 md:p-8 bg-[var(--bg-app)] relative scroll-smooth w-full">
    <router-outlet></router-outlet>
  </main>

  <prism-toast></prism-toast>
</div>
