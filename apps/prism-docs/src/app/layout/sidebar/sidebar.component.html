<div class="sidebar-header">
  <span class="logo-text">Prism Docs</span>
</div>

<nav class="sidebar-menu">
  @for (section of menu(); track section.group) {
    <div class="menu-section">
      <div class="section-title">{{ section.group }}</div>
      <ul>
        @for (item of section.items; track item.label) {
          <li>
            <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
              @if (item.icon) { 
                <prism-icon [name]="item.icon" class="sidebar-icon" /> 
              }
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</nav>

<div class="sidebar-footer">
  <div class="user-block">
    <prism-avatar label="ME" shape="circle" size="md"></prism-avatar>
    <div class="user-info">
      <span class="username">User</span>
      <span class="role">Admin</span>
    </div>
  </div>
  <prism-theme-toggle></prism-theme-toggle>
</div>
