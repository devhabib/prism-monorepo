name: "CI — Lint, Build & Test"

on:
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache Node Modules and Nx
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .nx/cache
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npx nx lint prism-core prism-theme prism-icons prism-docs --parallel=3

      - name: Run Build
        run: npx nx build prism-core prism-theme prism-icons --configuration=production --parallel=3

      - name: Run Tests
        run: npx nx test prism-core prism-theme prism-icons --parallel=3 --passWithNoTests
