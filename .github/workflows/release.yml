name: Release to NPM

on:
  push:
    branches:
      - main
    paths:
      - 'libs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Libraries
        run: |
          npx nx build prism-icons --configuration=production
          npx nx build prism-core --configuration=production
          npx nx build prism-theme --configuration=production

      - name: Publish Prism Icons
        run: |
          PACKAGE_VERSION=$(node -p "require('./dist/libs/prism-icons/package.json').version")
          if npm view @devynelogic/prism-icons@$PACKAGE_VERSION > /dev/null 2>&1; then
            echo "✅ Version $PACKAGE_VERSION exists. Skipping."
          else
            echo "🚀 Publishing prism-icons@$PACKAGE_VERSION..."
            npm publish dist/libs/prism-icons --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Prism Core
        run: |
          PACKAGE_VERSION=$(node -p "require('./dist/libs/prism-core/package.json').version")
          if npm view @devynelogic/prism-core@$PACKAGE_VERSION > /dev/null 2>&1; then
            echo "✅ Version $PACKAGE_VERSION exists. Skipping."
          else
            echo "🚀 Publishing prism-core@$PACKAGE_VERSION..."
            npm publish dist/libs/prism-core --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Prism Theme
        run: |
          PACKAGE_VERSION=$(node -p "require('./dist/libs/prism-theme/package.json').version")
          if npm view @devynelogic/prism-theme@$PACKAGE_VERSION > /dev/null 2>&1; then
            echo "✅ Version $PACKAGE_VERSION exists. Skipping."
          else
            echo "🚀 Publishing prism-theme@$PACKAGE_VERSION..."
            npm publish dist/libs/prism-theme --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
