name: Release to NPM

on:
  # 1. Automatic: Runs when you push version bumps to main
  push:
    branches:
      - main
    paths:
      - 'libs/**'

  # 2. Manual: Allows you to click a button in GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Libraries
        run: npx nx run-many -t build -p prism-icons prism-core prism-theme --configuration=production --skip-nx-cache --parallel=3


      - name: Publish Prism Icons
        if: github.ref == 'refs/heads/main' || github.event_name == 'push'
        run: |
          cd dist/libs/prism-icons
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "📦 Dist package version: $PACKAGE_VERSION"
          PUBLISHED=$(npm view @devynelogic/prism-icons@$PACKAGE_VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$PACKAGE_VERSION" ]; then
            echo "✅ Version $PACKAGE_VERSION already exists. Skipping."
          else
            echo "🚀 Publishing @devynelogic/prism-icons@$PACKAGE_VERSION..."
            npm publish --access public --provenance
            echo "✅ Published!"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Prism Core
        if: github.ref == 'refs/heads/main' || github.event_name == 'push'
        run: |
          cd dist/libs/prism-core
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "📦 Dist package version: $PACKAGE_VERSION"
          PUBLISHED=$(npm view @devynelogic/prism-core@$PACKAGE_VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$PACKAGE_VERSION" ]; then
            echo "✅ Version $PACKAGE_VERSION already exists. Skipping."
          else
            echo "🚀 Publishing @devynelogic/prism-core@$PACKAGE_VERSION..."
            npm publish --access public --provenance
            echo "✅ Published!"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Prism Theme
        if: github.ref == 'refs/heads/main' || github.event_name == 'push'
        run: |
          cd dist/libs/prism-theme
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "📦 Dist package version: $PACKAGE_VERSION"
          PUBLISHED=$(npm view @devynelogic/prism-theme@$PACKAGE_VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$PACKAGE_VERSION" ]; then
            echo "✅ Version $PACKAGE_VERSION already exists. Skipping."
          else
            echo "🚀 Publishing @devynelogic/prism-theme@$PACKAGE_VERSION..."
            npm publish --access public --provenance
            echo "✅ Published!"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
